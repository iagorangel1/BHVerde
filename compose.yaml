services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bhverde
      POSTGRES_USER: bhverde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - bhverde-postgres:/var/lib/postgresql/data

volumes:
  bhverde-postgres:
